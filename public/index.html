<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Watch Party (test page)</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 10px; }
    video { width: 100%; background: #000; }
    #ytbox { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; display: none; }
    #ytbox iframe { position: absolute; inset: 0; width: 100%; height: 100%; }
    #log { height: 140px; overflow: auto; border: 1px solid #ccc; padding: 6px; font-size: 13px; }
    .panel { border: 1px solid #ccc; border-radius: 6px; padding: 10px; margin-top: 12px; }
    .panel h3 { margin: 0 0 8px; font-size: 15px; }
    ul { padding-left: 18px; margin: 6px 0; }
    li { margin: 4px 0; }
    .bar { background: #e5e5e5; border-radius: 4px; height: 8px; margin-top: 3px; }
    .bar > div { background: #4a7bd8; height: 8px; border-radius: 4px; }
    .mine { font-weight: bold; }
    .hint { color: #666; font-size: 12px; }
    .movie { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid #eee; }
    .movie img { width: 60px; height: 90px; object-fit: cover; background: #ddd; border-radius: 4px; flex: none; }
    .movie .info { flex: 1; font-size: 13px; }
    .movie .info b { font-size: 14px; }
    #mvResults { max-height: 420px; overflow: auto; margin-top: 8px; }
    input { margin: 2px 0; }
    textarea { width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>
  <h2>Watch Party</h2>

  <div id="lobby">
    <input id="name" placeholder="Your name" />
    <button id="create">Create room</button>
    <input id="code" placeholder="Room code" />
    <button id="join">Join</button>
  </div>

  <div id="room" style="display:none">
    <p>Room: <b id="roomCode"></b> | Users: <span id="users"></span> | Drift: <span id="drift">0</span> ms</p>
    <video id="v" controls muted></video>
    <div id="ytbox"><div id="ytplayer"></div></div>
    <p class="hint">Videos start muted (browsers block autoplay with sound). Use the speaker icon to unmute.</p>
    <p>
      <button class="emoji">😂</button>
      <button class="emoji">🔥</button>
      <button class="emoji">😮</button>
    </p>

    <div class="panel">
      <h3>Shared playlist</h3>
      <input id="plTitle" placeholder="Title" />
      <input id="plUrl" placeholder="YouTube link or .mp4 link" size="40" />
      <button id="plAdd">Add</button>
      <ul id="playlist"></ul>
    </div>

    <div class="panel">
      <h3>Find movies</h3>
      <input id="mvQ" placeholder="Search all movies (typos are ok)" size="30" />
      <select id="mvCat">
        <option value="popular">Popular</option>
        <option value="top_rated">Top rated</option>
        <option value="now_playing">Now playing</option>
        <option value="upcoming">Upcoming</option>
        <option value="all">All</option>
      </select>
      <select id="mvGenre"><option value="">All genres</option></select>
      <select id="mvRating">
        <option value="">Any rating</option>
        <option value="6">6+</option>
        <option value="7">7+</option>
        <option value="8">8+</option>
      </select>
      <input id="mvYear" placeholder="Year" size="5" />
      <div id="mvStatus" class="hint"></div>
      <div id="mvResults"></div>
    </div>

    <div class="panel">
      <h3>Group poll</h3>
      <div id="pollForm">
        <input id="pollQ" placeholder="Question" size="40" />
        <textarea id="pollOpts" rows="3" placeholder="One option per line (2 to 6)"></textarea>
        <button id="pollCreate">Start poll</button>
        <button id="pollFromPl">Poll from playlist (winner plays)</button>
      </div>
      <div id="pollView"></div>
    </div>

    <div class="panel">
      <h3>Chat</h3>
      <div id="log"></div>
      <input id="msg" placeholder="Type a message" />
      <button id="send">Send</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const $ = (id) => document.getElementById(id);
    const video = $("v");

    let state = null;          // latest state from the server
    let lastVersion = -1;      // last playback version we applied to the player
    let clockOffset = 0;       // serverTime - clientTime
    let applying = false;      // true while WE change the player (so we don't echo it back)
    let myRoom = null, myName = "";

    // which player is active: "html5" (<video>) or "yt" (YouTube)
    let mode = "html5";
    let yt = null, ytReady = false, ytApiState = 0, ytCurrentId = null;
    const ytWaiters = [];
    let ytLast = { t: null, at: 0, ps: -1 }; // for detecting seeks made inside the YouTube player
    let ytPending = null, ytLastHardSeek = 0;

    // never put user text into innerHTML without this
    const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const log = (html) => { $("log").innerHTML += html + "<br>"; $("log").scrollTop = 1e9; };
    const dbg = (t) => log(`<i style="color:#888">[sync] ${esc(t)}</i>`);
    function btn(label, onClick) {
      const b = document.createElement("button");
      b.textContent = label;
      b.onclick = onClick;
      return b;
    }

    // ---- clock sync (a few pings, keep the one with the smallest round trip) ----
    function syncClock() {
      let best = { rtt: Infinity, offset: 0 }, n = 0;
      (function ping() {
        const t0 = Date.now();
        socket.emit("time:ping", (serverTime) => {
          const t1 = Date.now(), rtt = t1 - t0;
          if (rtt < best.rtt) best = { rtt, offset: serverTime + rtt / 2 - t1 };
          clockOffset = best.offset;
          if (++n < 5) setTimeout(ping, 100);
        });
      })();
    }

    // Where should the video be right now?
    function expectedPosition() {
      if (!state) return 0;
      if (!state.isPlaying) return state.position;
      const serverNow = Date.now() + clockOffset;
      return state.position + (serverNow - state.updatedAt) / 1000;
    }

    // ---- YouTube helpers ----
    // returns the 11-character video id for any common YouTube link, or null
    function ytId(url) {
      try {
        const u = new URL(url);
        const h = u.hostname.replace(/^www\.|^m\./, "");
        let id = null;
        if (h === "youtu.be") id = u.pathname.slice(1).split("/")[0];
        else if (h === "youtube.com" || h === "music.youtube.com" || h === "youtube-nocookie.com") {
          if (u.pathname === "/watch") id = u.searchParams.get("v");
          else {
            const m = u.pathname.match(/^\/(embed|shorts|live|v)\/([\w-]+)/);
            if (m) id = m[2];
          }
        }
        return id && /^[\w-]{11}$/.test(id) ? id : null;
      } catch (e) {
        return null;
      }
    }

    // loads the YouTube API once, then runs the callback when the player is ready
    function withYT(cb) {
      if (ytReady) return cb();
      ytWaiters.push(cb);
      if (ytApiState !== 0) return;
      ytApiState = 1;
      window.onYouTubeIframeAPIReady = () => {
        yt = new YT.Player("ytplayer", {
          width: "100%",
          height: "100%",
          playerVars: { playsinline: 1, rel: 0 },
          events: {
            onReady: () => {
              ytReady = true;
              yt.mute(); // muted so autoplay is allowed
              ytWaiters.splice(0).forEach((f) => f());
            },
            onStateChange: onYtState,
            onError: (e) => log(`<i>YouTube error ${esc(e.data)} (the video may not allow embedding)</i>`),
          },
        });
      };
      const tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.append(tag);
    }

    // The YouTube player has no "play/pause/seek by user" events, only state changes.
    // We only send something to the server when the player disagrees with the server state,
    // which also stops our own changes from bouncing back as new actions.
    function onYtState(e) {
      if (mode !== "yt" || !state || ytId(state.videoUrl) !== ytCurrentId) return;
      const s = e.data;            // 0 ended, 1 playing, 2 paused, 3 buffering, 5 cued
      if (s === 1 || s === 2) {
        // The player often flickers through pause/play (buffering, ads, seeking, hidden tab).
        // So wait a moment and only react if it is STILL in that state and we did not cause it.
        clearTimeout(ytPending);
        ytPending = setTimeout(() => {
          if (mode !== "yt" || !state || applying || document.hidden) return;
          const now = yt.getPlayerState(), t = yt.getCurrentTime();
          if (now === 1 && !state.isPlaying) {
            dbg("you pressed play in YouTube -> sent play");
            socket.emit("playback:play", { position: t });
          } else if (now === 2 && state.isPlaying) {
            dbg("you pressed pause in YouTube -> sent pause");
            socket.emit("playback:pause", { position: t });
          }
        }, 300);
      } else if (s === 0) {
        socket.emit("playlist:next", { itemId: state.currentItemId });
        const idx = state.playlist.findIndex((i) => i.id === state.currentItemId);
        if (idx === -1 || !state.playlist[idx + 1]) {
          // nothing after this video: pause so late joiners don't land past the end
          socket.emit("playback:pause", { position: yt.getDuration() });
        }
      }
    }

    // Detect seeks made by dragging YouTube's progress bar (there is no event for it)
    setInterval(() => {
      if (mode !== "yt" || !ytReady || !state) return;
      const t = yt.getCurrentTime(), now = Date.now(), ps = yt.getPlayerState();
      if (ytLast.t !== null && !applying && ps !== 3 && ytLast.ps !== 3) {
        const expectedLocal = ytLast.t + (ytLast.ps === 1 ? (now - ytLast.at) / 1000 : 0);
        const jumped = Math.abs(t - expectedLocal) > 1.5;
        const differsFromRoom = Math.abs(t - expectedPosition()) > 1;
        if (jumped && differsFromRoom) socket.emit("playback:seek", { position: t });
      }
      ytLast = { t, at: now, ps };
    }, 500);

    // ---- showing / hiding the two players ----
    function setMode(m) {
      mode = m;
      video.style.display = m === "html5" ? "block" : "none";
      $("ytbox").style.display = m === "yt" ? "block" : "none";
      if (m === "html5") {
        if (ytReady) yt.pauseVideo();
        ytCurrentId = null; // so going back to YouTube loads the video again
      } else {
        video.pause();
      }
    }

    function applyState() {
      const id = ytId(state.videoUrl);
      if (id) applyYT(id); else applyHtml5();
    }

    function applyYT(id) {
      setMode("yt");
      withYT(() => {
        const target = Math.max(0, expectedPosition());
        applying = true;
        if (ytCurrentId !== id) {
          ytCurrentId = id;
          const opts = { videoId: id, startSeconds: target };
          if (state.isPlaying) yt.loadVideoById(opts); else yt.cueVideoById(opts);
        } else {
          if (Math.abs(yt.getCurrentTime() - target) > 0.4) yt.seekTo(target, true);
          if (state.isPlaying) yt.playVideo(); else yt.pauseVideo();
        }
        ytLast = { t: null, at: 0, ps: -1 };
        setTimeout(() => (applying = false), 800);
      });
    }

    function applyHtml5() {
      setMode("html5");
      applying = true;
      const go = () => {
        video.currentTime = Math.max(0, expectedPosition());
        if (state.isPlaying) video.play().catch(() => {}); else video.pause();
        setTimeout(() => (applying = false), 300);
      };
      const wanted = new URL(state.videoUrl, location.href).href;
      if (video.src !== wanted) {
        // new video: wait until it has loaded before seeking
        video.src = wanted;
        video.addEventListener("loadedmetadata", go, { once: true });
        setTimeout(() => (applying = false), 3000); // in case the video never loads
      } else {
        go();
      }
    }

    // ---- lobby ----
    function enterRoom(res) {
      if (!res.ok) return alert(res.error);
      myRoom = res.code;
      history.replaceState(null, "", "/room/" + res.code);
      $("lobby").style.display = "none";
      $("room").style.display = "block";
      $("roomCode").textContent = res.code;
      loadGenres();
      searchMovies();
    }
    $("create").onclick = () => {
      myName = $("name").value || "Guest";
      socket.emit("room:create", { name: myName }, enterRoom);
    };
    $("join").onclick = () => {
      myName = $("name").value || "Guest";
      socket.emit("room:join", { code: $("code").value, name: myName }, enterRoom);
    };
    // invite link: /room/ABC123 pre-fills the code
    const m = location.pathname.match(/^\/room\/(\w+)/);
    if (m) $("code").value = m[1];

    // re-join automatically after a reconnect
    socket.on("connect", () => {
      syncClock();
      lastVersion = -1; // force a fresh sync of the video after (re)connecting
      if (myRoom) socket.emit("room:join", { code: myRoom, name: myName }, () => {});
    });

    // ---- rendering ----
    function renderUsers() {
      $("users").textContent = state.users
        .map((u) => u.name + (u.id === state.hostId ? " (host)" : ""))
        .join(", ");
    }

    function renderPlaylist() {
      const ul = $("playlist");
      ul.innerHTML = "";
      if (!state.playlist.length) { ul.innerHTML = "<li><i>Empty. Add a video above.</i></li>"; return; }
      state.playlist.forEach((item) => {
        const li = document.createElement("li");
        const t = document.createElement("span");
        t.textContent = (item.id === state.currentItemId ? "▶ " : "") + item.title + " (by " + item.addedBy + ") ";
        if (item.id === state.currentItemId) t.className = "mine";
        li.append(t,
          btn("Play", () => socket.emit("playlist:play", { id: item.id })),
          btn("✕", () => socket.emit("playlist:remove", { id: item.id })));
        ul.append(li);
      });
    }

    function renderPoll() {
      const box = $("pollView");
      box.innerHTML = "";
      const p = state.poll;
      if (!p) return;
      const total = p.options.reduce((a, o) => a + o.count, 0);
      const mine = p.votes[socket.id];

      const q = document.createElement("p");
      q.innerHTML = "<b></b> " + (p.open ? "" : "<i>(closed)</i>");
      q.querySelector("b").textContent = p.question;
      box.append(q);

      p.options.forEach((o, i) => {
        const row = document.createElement("div");
        const label = document.createElement("span");
        label.textContent = o.text + " - " + o.count + " vote" + (o.count === 1 ? "" : "s") + " ";
        if (mine === i) label.className = "mine";
        row.append(label);
        if (p.open) row.append(btn(mine === i ? "Voted" : "Vote", () => socket.emit("poll:vote", { index: i })));
        const bar = document.createElement("div");
        bar.className = "bar";
        const fill = document.createElement("div");
        fill.style.width = (total ? (o.count / total) * 100 : 0) + "%";
        bar.append(fill);
        row.append(bar);
        box.append(row);
      });

      if (p.open && (socket.id === state.hostId || socket.id === p.creatorId)) {
        box.append(btn("Close poll", () => socket.emit("poll:close")));
      }
    }

    // ---- server -> client ----
    socket.on("state:update", (s) => {
      state = s;
      renderUsers();
      renderPlaylist();
      renderPoll();
      // only touch the player when playback really changed (not for chat, votes, joins...)
      if (s.version !== lastVersion) {
        lastVersion = s.version;
        applyState();
      }
    });
    socket.on("chat:message", (c) => log(`<b>${esc(c.from)}:</b> ${esc(c.text)}`));
    socket.on("chat:system", (t) => log(`<i>${esc(t)}</i>`));
    socket.on("reaction:show", (r) => log(`${esc(r.from)} reacted ${esc(r.emoji)}`));

    // ---- client -> server for the normal <video> (only when the USER did it) ----
    video.onplay   = () => mode === "html5" && !applying && socket.emit("playback:play",  { position: video.currentTime });
    video.onpause  = () => mode === "html5" && !applying && socket.emit("playback:pause", { position: video.currentTime });
    video.onseeked = () => mode === "html5" && !applying && socket.emit("playback:seek",  { position: video.currentTime });
    // video finished -> ask the server to play the next playlist item
    video.onended  = () => mode === "html5" && state && socket.emit("playlist:next", { itemId: state.currentItemId });

    $("send").onclick = () => { socket.emit("chat:message", $("msg").value); $("msg").value = ""; };
    $("msg").onkeydown = (e) => { if (e.key === "Enter") $("send").click(); };
    document.querySelectorAll(".emoji").forEach((b) => (b.onclick = () => socket.emit("reaction:send", b.textContent)));

    $("plAdd").onclick = () => {
      socket.emit("playlist:add", { title: $("plTitle").value, url: $("plUrl").value });
      $("plTitle").value = ""; $("plUrl").value = "";
    };
    $("pollCreate").onclick = () => {
      socket.emit("poll:create", { question: $("pollQ").value, options: $("pollOpts").value.split("\n") });
      $("pollQ").value = ""; $("pollOpts").value = "";
    };
    $("pollFromPl").onclick = () => socket.emit("poll:create", { fromPlaylist: true });

    // ---- movie discovery (talks to our own /api/movies routes) ----
    let mvTimer = null;
    const mvDebounced = () => { clearTimeout(mvTimer); mvTimer = setTimeout(searchMovies, 300); };

    async function loadGenres() {
      try {
        const r = await fetch("/api/movies/genres");
        const d = await r.json();
        if (!r.ok) throw new Error(d.error);
        d.genres.forEach((g) => {
          const o = document.createElement("option");
          o.value = g.id;
          o.textContent = g.name;
          $("mvGenre").append(o);
        });
      } catch (e) { /* the status line shows the real problem when we search */ }
    }

    async function searchMovies() {
      const q = $("mvQ").value.trim();
      const params = new URLSearchParams({
        q,
        category: q ? "all" : $("mvCat").value, // when searching, look through everything
        genre: $("mvGenre").value,
        minRating: $("mvRating").value,
        year: $("mvYear").value.trim(),
      });
      $("mvStatus").textContent = "Loading...";
      try {
        const r = await fetch("/api/movies?" + params);
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || "Search failed");
        $("mvStatus").textContent = d.total + " movie" + (d.total === 1 ? "" : "s") + " found" + (d.total > d.movies.length ? " (showing " + d.movies.length + ")" : "");
        renderMovies(d.movies);
      } catch (e) {
        $("mvStatus").textContent = e.message;
        $("mvResults").innerHTML = "";
      }
    }

    function renderMovies(list) {
      const box = $("mvResults");
      box.innerHTML = "";
      list.forEach((m) => {
        const row = document.createElement("div");
        row.className = "movie";
        const img = document.createElement("img");
        if (m.poster_path) img.src = "https://image.tmdb.org/t/p/w185" + m.poster_path;
        img.alt = "";
        const info = document.createElement("div");
        info.className = "info";
        const title = document.createElement("b");
        title.textContent = m.title;
        const meta = document.createElement("div");
        meta.className = "hint";
        meta.textContent = (m.release_date || "").slice(0, 4) + " | rating " + m.vote_average.toFixed(1);
        const about = document.createElement("div");
        about.textContent = m.overview.length > 160 ? m.overview.slice(0, 160) + "..." : m.overview;
        const add = btn("Add trailer to playlist", () => addTrailer(m, add));
        info.append(title, meta, about, add);
        row.append(img, info);
        box.append(row);
      });
    }

    async function addTrailer(m, button) {
      button.disabled = true;
      button.textContent = "Finding trailer...";
      try {
        const r = await fetch("/api/movies/" + m.id + "/trailer");
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || "No trailer");
        socket.emit("playlist:add", { title: m.title + " (trailer)", url: d.url });
        button.textContent = "Added ✓";
      } catch (e) {
        button.textContent = e.message;
      }
    }

    ["mvQ", "mvYear"].forEach((id) => ($(id).oninput = mvDebounced));
    ["mvCat", "mvGenre", "mvRating"].forEach((id) => ($(id).onchange = searchMovies));

    // ---- drift correction, every 2 seconds ----
    setInterval(() => {
      if (!state || !state.isPlaying) return;

      if (mode === "yt") {
        // YouTube only has fixed speeds (0.75x, 1x, 1.25x...), so we nudge with those
        // and only jump when we are far off (jumping makes YouTube re-buffer and freeze).
        if (!ytReady || applying || yt.getPlayerState() !== 1) return;
        const driftMs = (yt.getCurrentTime() - expectedPosition()) * 1000;
        $("drift").textContent = Math.round(driftMs);
        const abs = Math.abs(driftMs);
        if (abs > 2000 && Date.now() - ytLastHardSeek > 5000) {
          ytLastHardSeek = Date.now();
          dbg("far out of sync (" + Math.round(driftMs) + " ms) -> jumping");
          applying = true;
          yt.seekTo(expectedPosition(), true);
          ytLast = { t: null, at: 0, ps: -1 };
          setTimeout(() => (applying = false), 800);
        } else if (abs > 300) {
          yt.setPlaybackRate(driftMs > 0 ? 0.75 : 1.25);
        } else if (abs < 150) {
          yt.setPlaybackRate(1);
        }
        return;
      }

      if (video.paused) return;
      const driftMs = (video.currentTime - expectedPosition()) * 1000;
      $("drift").textContent = Math.round(driftMs);
      const abs = Math.abs(driftMs);
      applying = true;
      if (abs > 500) video.currentTime = expectedPosition();              // too far: jump
      else if (abs > 200) video.playbackRate = driftMs > 0 ? 0.95 : 1.05; // small: slow down / speed up
      else video.playbackRate = 1;                                         // fine
      setTimeout(() => (applying = false), 300);
    }, 1000);

    // coming back to a tab that was in the background: catch up with the room
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && state) applyState();
    });
  </script>
</body>
</html>
